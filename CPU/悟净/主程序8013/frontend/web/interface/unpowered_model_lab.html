<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>断电模型离线分析</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#eef3f8;color:#18354f;margin:0}main{max-width:1050px;margin:35px auto;background:white;padding:30px;border-radius:14px}button,select,input{font:inherit;padding:9px;margin:8px;border:1px solid #bbcbd8;border-radius:6px}button{cursor:pointer;background:#2168a3;color:white}.note{padding:16px;background:#fff3da;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f6fa;padding:18px;max-height:600px;overflow:auto}textarea{width:96%;height:180px;font:14px monospace;padding:10px}h1{font-size:27px}small{color:#52677a}</style><main><a href="/">返回原控制台</a><h1>断电模型 · CPU离线分析</h1><p class="note">模型条件：供电轨断开、固定公共地。计算方式：CPU离线分析；数据源：已保存的校准F6。</p><section><h2>已保存校准数据</h2><p>粘贴包含job、reference、observations、confirmations的JSON。没有下一轮数据时返回needs_measurement及明确的测量请求。禁止把未标定原码改名为features后提交。</p><textarea id="saved" placeholder="粘贴断电模型请求JSON"></textarea><button id="evaluate">分析已保存数据</button></section><h2>状态与逐轮证据</h2><p id="status">读取模型信息…</p><pre id="result"></pre></main><script>
const base='/diagnosis/unpowered/model',out=document.getElementById('result'),status=document.getElementById('status');
async function post(path,body){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data;}
async function go(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='计算中（不会发出硬件动作）';try{const r=await fn();out.textContent=JSON.stringify(r,null,2);status.textContent=(r.status||'完成')+' · '+(r.conditions??0)+'个条件 · CPU '+Number(r.diagnostic_ms||0).toFixed(2)+'ms';}catch(e){status.textContent=e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
fetch(base+'/info').then(async r=>{const info=await r.json();if(!r.ok)throw Error(info.error);status.textContent='CPU离线分析已就绪';out.textContent=JSON.stringify(info,null,2);}).catch(e=>status.textContent=e.message+'；请先打开主页建立会话。');
document.getElementById('evaluate').onclick=()=>go(()=>post('/evaluate',JSON.parse(document.getElementById('saved').value)));
</script></html>
